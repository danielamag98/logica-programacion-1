<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura - logica-programacion-2</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="card">
        <h2>Conversion de Temperatura</h2>
        <p>Ingresa los grados Celsius (°C):</p>

        <input type="text" id="celsiusInput" placeholder="Escribe la temperatura">
        <br>
        <button onclick="conversionTemp()">Convertir</button>

        <div id="mensajeError" class="error"></div>
        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
